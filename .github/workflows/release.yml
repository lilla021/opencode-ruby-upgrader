name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: test "v$(node -p \"require('./package.json').version\")" = "$GITHUB_REF_NAME"
      - run: npm exec --yes --package=opencode-ai@1.18.30 -- sh -c 'OPENCODE_RUNTIME_E2E=1 npm run test:opencode'
      - run: npm pack --dry-run
      # Publishes via npm trusted publishing (OIDC) once the trusted
      # publisher for opencode-ruby-upgrader is configured on npmjs.com.
      # No NODE_AUTH_TOKEN/NPM_TOKEN secret: the npm CLI exchanges the
      # GitHub Actions OIDC token for a short-lived publish credential.
      - run: npm publish --provenance
