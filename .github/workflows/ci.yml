name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mirrors the engines.node floor (>=22.5.0) across current Node lines, so
        # the declared support range is actually exercised. release.yml publishes
        # from Node 22 only -- one publish, not three.
        node-version: [22, 24, 26]
    steps:
      # Pinned to immutable commit SHAs (actions runtime hardening).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # Pin npm so this matrix varies Node, not npm. `allowScripts` (npm >= 11)
      # is load-bearing for the opencode-ai postinstall below, and release.yml
      # publishes with this same npm version.
      - run: npm install -g npm@11.16.0
      - run: npm test
      - run: npm pack --dry-run
      - run: npm install --no-save --no-package-lock opencode-ai@1.18.30
      - run: OPENCODE_RUNTIME_E2E=1 npm run test:opencode

  adapter-runtime:
    # Real container evidence for both database adapters. Unit tests mock `docker
    # spawn`, so they can never catch a wrong readiness probe, a bad connection
    # URL, or a driver gem that never loads. This job provisions a real
    # mysql:8.4 and a real postgres:16-alpine and runs RSpec through each app's
    # own driver.
    #
    # Both engines are proven here rather than only MySQL. PostgreSQL is the
    # default, so it is the path most users hit first, and it was the one adapter
    # that had never run against a real container: its `createArgs` invoke the
    # app's `rake db:create`, which needs a bootable Rails app, and the earlier
    # Gemfile-only fixture would have failed if it had been exercised.
    #
    # Deliberately NOT a leg of the `test` matrix: it validates Docker and
    # database behavior rather than Node compatibility, and each extra leg would
    # re-pull ~150MB images and recompile a native driver extension for no added
    # signal. Same single-Node-22 reasoning as publishing in release.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: 22
      # Fail with a readable message if a runner ever loses its Docker socket,
      # instead of surfacing it later as a confusing image-pull error. The
      # script re-checks this itself, but a preflight names the real problem.
      - name: Verify Docker is available
        run: docker version
      # No dependency install: the smoke script imports src/ modules and Node
      # builtins only, so it needs no npm dependencies or allowScripts approval.
      # Headroom over the ~9min local run covers both cold image pulls, the
      # Rails/driver/rspec bundle, and native driver compilation.
      - name: MySQL adapter smoke against a real container
        timeout-minutes: 25
        run: npm run test:docker:mysql
      # Each engine is a separate step so a failure names the adapter that broke
      # rather than "the database smoke". Runs second so a MySQL failure still
      # reports its full teardown check.
      - name: PostgreSQL adapter smoke against a real container
        timeout-minutes: 25
        run: npm run test:docker:postgres
