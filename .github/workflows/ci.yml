name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm pack --dry-run
      - run: npm install --no-save --no-package-lock opencode-ai@1.18.30
      - run: OPENCODE_RUNTIME_E2E=1 npm run test:opencode
